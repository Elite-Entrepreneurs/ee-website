<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elite</title>
    <meta
      name="description"
      content="Canada’s Most Connected Tech Community. Meet leaders, share ideas, and connect with people who can open new doors."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/elite-icon-256.png" />
    <link rel="preload" href="/assets/fonts/featuredisplay-regular.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/assets/fonts/artex-regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/ppmondwest-regular-1.otf" as="font" type="font/otf" crossorigin />
    <script>
      // Same as Webflow's head snippet: flags JS / touch support on <html>.
      (function (o, c) {
        var n = c.documentElement, t = ' w-mod-';
        n.className += t + 'js';
        if ('ontouchstart' in o || (o.DocumentTouch && c instanceof DocumentTouch)) n.className += t + 'touch';
      })(window, document);
      // Mobile nav height fix (original site snippet).
      document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
      window.addEventListener('resize', function () {
        document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
